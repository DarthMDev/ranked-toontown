services:
  db:
    image: mongo:latest
    # Use this command to run mongo normally with authentication. Use --quiet and --logpath /dev/null to supress output.
    #    command: mongod --bind_ip 0.0.0.0
    # Use this command instead if you are having authentication issues.
    # It is not recommended, but as long as you are NOT exposing any ports, it is mostly safe in non-production environments.
    command: mongod --noauth --bind_ip 0.0.0.0 --quiet --logpath /dev/null
    container_name: db
    # Environment variables needed if authentication is enabled.
#    environment:
#      - MONGO_INITDB_DATABASE=admin
#      - MONGO_INITDB_ROOT_USERNAME=$MONGO_ROOT_USERNAME
#      - MONGO_INITDB_ROOT_PASSWORD=$MONGO_ROOT_PASSWORD
    # Only expose ports if you NEED to externally access the database.
#    ports:  # Use for windows
#      - "27017:27017"
#    ports: # Use for linux
#      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    mem_reservation: 512m

  astron:
    depends_on:
      - db
    build:
      context: ../..
      dockerfile: launch/docker/astron.dockerfile
    platform: linux/amd64 # Force x64 on ARM platforms.
    restart: always
    ports:
      - "7198:7198"
    volumes:
      - "../..:/app/game"

  uberdog:
    depends_on:
      - astron
    image: rankedtt-server
    pull_policy: never # Hack to prevent building the same image twice
    build:
      context: ../..
      dockerfile: launch/docker/server.dockerfile
    platform: linux/amd64 # Force x64 on ARM platforms.
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVICE_TO_RUN: UD
      BASE_CHANNEL: 1000000
      MAX_CHANNELS: 999999
      STATESERVER: 4002
      ASTRON_IP: astron:7199
      EVENTLOGGER_IP: astron:7197
      PLAYTOKEN_STORAGE_STRATEGY: $PLAYTOKEN_STORAGE_STRATEGY
      MONGO_CONNECTION_STRING: $MONGO_CONNECTION_STRING
      AUTHENTICATION_SCHEME: $AUTHENTICATION_SCHEME
      DISCORD_APP_CLIENT_ID: $DISCORD_APP_CLIENT_ID
      DISCORD_APP_CLIENT_SECRET: $DISCORD_APP_CLIENT_SECRET
      DISCORD_APP_CLIENT_REDIRECT: $DISCORD_APP_CLIENT_REDIRECT
    volumes:
      - "../..:/app"

  ai:
    depends_on:
      - astron
      - uberdog
    image: rankedtt-server
    pull_policy: never # Hack to prevent building the same image twice
    platform: linux/amd64 # Force x64 on ARM platforms.
    restart: always
    environment:
      SERVICE_TO_RUN: AI
      BASE_CHANNEL: 401000000
      MAX_CHANNELS: 999999
      STATESERVER: 4002
      ASTRON_IP: astron:7199
      EVENTLOGGER_IP: astron:7197
      DISTRICT_NAME: "Ranked Realms"
    volumes:
      - "../..:/app"

volumes:
  mongo_data:
